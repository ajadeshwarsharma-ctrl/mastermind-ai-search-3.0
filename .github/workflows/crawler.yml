name: Mastermind X Crawler

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🚀 Run Mastermind X Crawler
        run: node crawler.js

      - name: 📚 Build Search Index
        run: node indexer.js

      - name: 💾 Commit Updated Files
        run: |
          git config --global user.name "AjadeshBot"
          git config --global user.email "ajadeshbot@users.noreply.github.com"

          git add raw-data.json index.json knowledge.json

          git diff --cached --quiet || git commit -m "🤖 Mastermind X Bot updated search database"

          git push
